name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to receive the playable demo folder ZIP and checksum (blank builds artifacts only)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libsdl2-dev libegl1-mesa-dev libgl1-mesa-dri glslang-tools
      - run: python3 tools/bootstrap.py --host-only
      - run: make test
  native:
    if: github.event_name == 'workflow_dispatch'
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang clang-18 lld-18 llvm-18 make python3 python3-venv git gh pkg-config wget unzip libssl-dev libsdl2-dev libegl1-mesa-dev libgl1-mesa-dri glslang-tools
      - run: make deps
      - name: Fetch the unchanged official demo archive from the release mirror
        run: gh release download v0.1.0-alpha.3 --pattern q2-314-demo-x86.exe --dir .deps
      - run: make package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PPSA99007-120hz
          path: |
            dist/PPSA99007.zip
            dist/PPSA99007.zip.sha256
          if-no-files-found: error
      - name: Publish verified demo packages to the requested release
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" dist/PPSA99007.zip dist/PPSA99007.zip.sha256 --repo "$GITHUB_REPOSITORY"
