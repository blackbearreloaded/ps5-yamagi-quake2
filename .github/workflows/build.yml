name: Build
on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to receive the playable demo folder ZIP and checksum (blank builds artifacts only)
        type: string
        default: ''
      snapshot:
        description: Also hand over this run's compiler cache as the build-cache snapshot (run it on main)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libsdl2-dev libegl1-mesa-dev libgl1-mesa-dri glslang-tools
      - run: python3 tools/bootstrap.py --host-only
      - run: make test
  native:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # id-token and attestations are for the "Attest the release files" step only.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang clang-18 lld-18 llvm-18 make ccache python3 python3-venv git gh pkg-config wget unzip libssl-dev libsdl2-dev libegl1-mesa-dev libgl1-mesa-dri glslang-tools
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang18-
      # GitHub drops a cache nobody used for a week. When nothing was restored, start from the
      # snapshot kept as a file of the build-cache release; a manual run with "snapshot" ticked
      # hands over a new one.
      - name: Fetch the compiler cache snapshot
        run: |
          if [ -z "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/build-cache/ccache-clang18.tar"
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache-clang18.tar" "$url"; then
              mkdir -p "$CCACHE_DIR"
              tar -xf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR"
              rm "$RUNNER_TEMP/ccache-clang18.tar"
              echo "::notice title=Compiler cache::Started from the build-cache snapshot."
            fi
          fi
      - run: ccache --zero-stats
      - run: make deps
      - name: Fetch the unchanged official demo archive from the release mirror
        run: gh release download v0.1.0-alpha.3 --pattern q2-314-demo-x86.exe --dir .deps
      # tools/build-ps5.sh compiles through ccache whenever it is installed.
      - run: make package
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats
      # ccache compresses what it stores, so the snapshot is a plain tar.
      - name: Pack the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: tar -cf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR" .
      - name: Upload the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-snapshot
          path: ${{ runner.temp }}/ccache-clang18.tar
          if-no-files-found: error
          retention-days: 1
      - name: Check the ZIP and its checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          python3 - PPSA99007.zip PPSA99007 <<'PY'
          import sys, zipfile
          archive, title = sys.argv[1:3]
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert z.testzip() is None, "damaged entry"
              assert all(n.startswith(title + "/") for n in names), "entries outside the app folder"
              assert title + "/eboot.bin" in names, "no eboot.bin"
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              print(f"{archive}: {len(names)} entries, all 0777")
          PY
          sha256sum --check --strict PPSA99007.zip.sha256
      # Signed provenance: these files were built by this workflow from this commit. Anyone can check
      # a downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release files
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/PPSA99007.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PPSA99007-120hz
          path: |
            dist/PPSA99007.zip
            dist/PPSA99007.zip.sha256
          if-no-files-found: error
      - name: Publish verified demo packages to the requested release
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # The release must already exist; its title and notes are not touched.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          TAG=$RELEASE_TAG
          # A file the release already has is never replaced or removed. Only missing files are added.
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          has() { grep -Fxq -- "$1" <<< "$existing"; }
          kept() { echo "::warning title=Release file not from this run::A release for $TAG already has $1; it was not replaced. It was not published by this run and may have no attestation."; }
          if has PPSA99007.zip; then
            kept PPSA99007.zip
            # This run's checksum file describes this run's ZIP, not the one the release keeps.
            if has PPSA99007.zip.sha256; then kept PPSA99007.zip.sha256; fi
            exit 0
          fi
          gh release upload "$TAG" dist/PPSA99007.zip --repo "$GITHUB_REPOSITORY"
          if has PPSA99007.zip.sha256; then
            kept PPSA99007.zip.sha256
          else
            gh release upload "$TAG" dist/PPSA99007.zip.sha256 --repo "$GITHUB_REPOSITORY"
          fi
